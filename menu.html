<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Menu | TastyBite</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="rm.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="rm.html">TastyBite</a>
    <div>
      <a class="nav-link text-white" href="menu.html">Menu</a>
    </div>
  </div>
</nav>

<div class="container my-5">
  <h2 class="text-center mb-4">Our Menu</h2>

  <!-- Filter Buttons -->
  <div class="text-center mb-4">
    <button class="btn btn-outline-dark filter-btn" data-category="all">All</button>
    <button class="btn btn-outline-dark filter-btn" data-category="breakfast">Breakfast</button>
    <button class="btn btn-outline-dark filter-btn" data-category="lunch">Lunch</button>
    <button class="btn btn-outline-dark filter-btn" data-category="dinner">Dinner</button>
  </div>

  <!-- Menu Items -->
  <div class="row" id="menuItems">
    
    <div class="col-md-4 menu-item breakfast">
      <div class="card">
        <div class="card-body">
          <h5>Pancakes</h5>
          <p>₦2500</p>
          <button class="btn btn-warning order-btn">Order Now</button>
        </div>
      </div>
    </div>

    <div class="col-md-4 menu-item lunch">
      <div class="card">
        <div class="card-body">
          <h5>Jollof Rice</h5>
          <p>₦3500</p>
          <button class="btn btn-warning order-btn">Order Now</button>
        </div>
      </div>
    </div>

    <div class="col-md-4 menu-item dinner">
      <div class="card">
        <div class="card-body">
          <h5>Grilled Chicken</h5>
          <p>₦5000</p>
          <button class="btn btn-warning order-btn">Order Now</button>
        </div>
      </div>
    </div>

  </div>
</div>

<footer class="bg-dark text-white text-center py-3">
  © 2026 TastyBite Restaurant
</footer>

<script src="js/script.js"></script>
</body>
</html>
